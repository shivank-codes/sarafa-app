<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">

     servers, where a relative path has nothing to resolve against. -->

<meta property="og:locale" content="hi_IN">
<meta property="og:site_name" content="सर्राफ">
<meta property="og:title" content="संकेत कुमार मुकेश कुमार सर्राफ">
<meta property="og:description" content="सोने-चांदी के भाव, बिल, उधार और गिरवी का हिसाब — बिना इंटरनेट भी चलने वाला हिंदी ऐप।">
<meta property="og:url" content="https://shivank-codes.github.io/sarafa-app/">
<meta property="og:image" content="https://shivank-codes.github.io/sarafa-app/icons/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:image:alt" content="सर्राफ">

<body>
<header id="shop-name">
  <img id="devi" src="img/sherowali.svg" alt="जय माता दी" width="46" height="46">
  <span id="shop-title"></span>
</header>
<p id="storage-warning" class="banner" hidden></p>
<div id="install-hint" class="banner soft install-hint" hidden></div>
<main>
  <section id="panel-bhav" class="panel"></section>
  <section id="panel-bill" class="panel" hidden></section>
  <section id="panel-udhaar" class="panel" hidden></section>
  <section id="panel-grahak" class="panel" hidden></section>
  <section id="panel-design" class="panel" hidden></section>
  <section id="panel-girvi" class="panel" hidden></section>
</main>
<nav id="tabs">
  <button data-tab="bhav" class="active">भाव</button>
  <button data-tab="bill">बिल</button>
  <button data-tab="udhaar">उधार</button>
  <button data-tab="grahak">ग्राहक</button>
  <button data-tab="design">डिज़ाइन</button>
  <button data-tab="girvi">गिरवी</button>
</nav>
<script type="module" src="js/app.js"></script>
